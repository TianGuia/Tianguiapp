name: Verificación de Flutter

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Verificar en el mismo contenedor que el entorno local
        run: docker compose -f compose.verify.yaml run --build --rm -T verify
