name: Compilar releases

on:
  push:
    tags: ['*']
    branches: ['**']
    paths: ['pubspec.yaml']

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.8'
  APP_NAME: tianguia

jobs:
  version:
    name: Guardar versión de la release
    if: github.ref_type == 'tag' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      should_build: ${{ steps.prepare.outputs.should_build }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: version-state
          fetch-depth: 0
      - name: Validar y guardar versión de la release
        id: prepare
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          python3 .github/scripts/release_version.py prepare \
            --repo version-state --branch "$DEFAULT_BRANCH" \
            --output release-metadata/version.json
      - name: Compartir versión con ambas plataformas
        if: steps.prepare.outputs.should_build == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-version
          path: release-metadata/version.json
          if-no-files-found: error
          overwrite: true

  android:
    name: APK Android
    needs: version
    if: needs.version.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: release-version
          path: release-metadata
      - name: Aplicar versión guardada
        id: version
        run: python3 .github/scripts/release_version.py apply --metadata release-metadata/version.json
      - name: Preparar Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/**/gradle-wrapper.properties
            pubspec.lock
      - name: Preparar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Limitar memoria y activar cachés de compilación
        run: |
          mkdir -p "$HOME/.gradle"
          cat >> "$HOME/.gradle/gradle.properties" <<'PROPERTIES'
          org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G
          kotlin.daemon.jvmargs=-Xmx1G
          kotlin.incremental=true
          org.gradle.caching=true
          org.gradle.workers.max=2
          PROPERTIES
      - name: Instalar dependencias
        run: flutter pub get --enforce-lockfile
      - name: Verificar la app
        run: |
          flutter analyze --no-pub
          flutter test --no-pub
      - name: Preparar clave de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          value = os.environ.get('KEYSTORE_BASE64', '')
          if not value:
              raise SystemExit('Falta el Secret ANDROID_KEYSTORE_BASE64')
          destination = Path(os.environ['RUNNER_TEMP']) / 'tianguia-release.p12'
          destination.write_bytes(base64.b64decode(value, validate=True))
          destination.chmod(0o600)
          PY
      - name: Compilar APK firmados
        env:
          TIANGUIA_ANDROID_KEYSTORE: ${{ runner.temp }}/tianguia-release.p12
          TIANGUIA_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TIANGUIA_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TIANGUIA_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
        run: |
          flutter build apk --release --no-pub \
            --target-platform android-arm,android-arm64,android-x64 \
            --build-name "$VERSION_NAME" --build-number "$BUILD_NUMBER"
          mkdir -p build/release-apks
          cp build/app/outputs/flutter-apk/app-release.apk \
            "build/release-apks/${APP_NAME}-${VERSION_NAME}+${BUILD_NUMBER}.apk"
      - name: Guardar APK
        uses: actions/upload-artifact@v7
        with:
          name: tianguia-android-${{ steps.version.outputs.version_name }}+${{ steps.version.outputs.build_number }}
          path: build/release-apks/*.apk
          if-no-files-found: error
          compression-level: 0
          overwrite: true
      - name: Retirar clave temporal
        if: always()
        run: rm -f "$RUNNER_TEMP/tianguia-release.p12"

  release:
    name: Publicar APK en Releases
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.run_id }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-version
          path: release-metadata
      - name: Descargar APK firmados
        uses: actions/download-artifact@v8
        with:
          # Evitar outputs de job: GitHub puede omitirlos si coinciden con un secreto.
          pattern: tianguia-android-*
          merge-multiple: true
          path: release-apks
      - name: Crear o actualizar Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_TAG="$(python3 -c 'import json; print(json.load(open("release-metadata/version.json"))["release_tag"])')"
          shopt -s nullglob
          apks=(release-apks/*.apk)
          if [[ ${#apks[@]} -ne 1 ]]; then
            echo "Se esperaba un APK universal firmado de Android." >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${apks[@]}" --clobber
          else
            options=(--verify-tag --generate-notes --title "TianGuía $RELEASE_TAG")
            version_without_build="${RELEASE_TAG%%+*}"
            if [[ "$version_without_build" == *-* ]]; then
              options+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" "${apks[@]}" "${options[@]}"
          fi

  ios:
    name: IPA iOS sin firmar
    needs: version
    if: needs.version.outputs.should_build == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: release-version
          path: release-metadata
      - name: Aplicar versión guardada
        id: version
        run: python3 .github/scripts/release_version.py apply --metadata release-metadata/version.json
      - name: Preparar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Instalar dependencias
        run: flutter pub get --enforce-lockfile
      - name: Verificar la app
        run: |
          flutter analyze --no-pub
          flutter test --no-pub
      - name: Compilar la app iOS para dispositivo
        env:
          VERSION_NAME: ${{ steps.version.outputs.ios_version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
        run: |
          flutter build ios --release --no-codesign --no-pub \
            --build-name "$VERSION_NAME" --build-number "$BUILD_NUMBER"
      - name: Empaquetar IPA sin firmar
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
        run: |
          mkdir -p build/ios/ipa/Payload
          ditto build/ios/iphoneos/Runner.app build/ios/ipa/Payload/Runner.app
          cd build/ios/ipa
          zip -qry "${APP_NAME}-${VERSION_NAME}+${BUILD_NUMBER}.ipa" Payload
      - name: Guardar IPA sin firmar
        uses: actions/upload-artifact@v7
        with:
          name: tianguia-ios-${{ steps.version.outputs.version_name }}+${{ steps.version.outputs.build_number }}
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  release-ios:
    name: Publicar IPA sin firmar en Releases
    needs: ios
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.run_id }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-version
          path: release-metadata
      - name: Descargar IPA sin firmar
        uses: actions/download-artifact@v8
        with:
          pattern: tianguia-ios-*
          merge-multiple: true
          path: release-ipas
      - name: Crear o actualizar Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_TAG="$(python3 -c 'import json; print(json.load(open("release-metadata/version.json"))["release_tag"])')"
          shopt -s nullglob
          ipas=(release-ipas/*.ipa)
          if [[ ${#ipas[@]} -ne 1 ]]; then
            echo "Se esperaba un IPA sin firmar de iOS." >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${ipas[@]}" --clobber
          else
            options=(--verify-tag --generate-notes --title "TianGuía $RELEASE_TAG")
            version_without_build="${RELEASE_TAG%%+*}"
            if [[ "$version_without_build" == *-* ]]; then
              options+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" "${ipas[@]}" "${options[@]}"
          fi
