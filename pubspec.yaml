name: tianguia
description: TianGuía - localiza puestos y productos del tianguis.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.0
  shared_preferences: ^2.3.0
  geolocator: ^13.0.0
  image_picker: ^1.1.2
  google_fonts: ^6.2.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  http: ^1.6.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/

# Ícono de la app. Desde el SVG: ./scripts/generate-icons.ps1
# Desde los PNG ya preparados: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#0754AD"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  adaptive_icon_foreground_inset: 0

# Pantalla de arranque nativa (azul + logo). Se genera con:
#   dart run flutter_native_splash:create
flutter_native_splash:
  color: "#0B2A8F"
  image: assets/images/logo.png
  android_12:
    color: "#0B2A8F"
    image: assets/images/logo.png
