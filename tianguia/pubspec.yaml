name: tianguia
description: TianGuía - localiza puestos y productos del tianguis.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.0
  geolocator: ^13.0.0
  image_picker: ^1.1.2
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/

# Ícono de la app (el de tu diseño). Se genera con:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#0B2A8F"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"

# Pantalla de arranque nativa (azul + logo). Se genera con:
#   dart run flutter_native_splash:create
flutter_native_splash:
  color: "#0B2A8F"
  image: assets/images/logo.png
  android_12:
    color: "#0B2A8F"
    image: assets/images/logo.png
